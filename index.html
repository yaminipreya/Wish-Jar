<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Jar of Wishes ✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for interactive states -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts for Playful Handwriting & Rounded Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=DynaPuff:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF9F5',
                        pastelPink: '#F8C8D8',
                        lavender: '#DCCEF9',
                        skyBlue: '#CDEAF7',
                        softYellow: '#FFE7A3',
                        jarText: '#5E4B56'
                    },
                    fontFamily: {
                        heading: ['"DynaPuff"', 'cursive'],
                        body: ['"Quicksand"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-jarText min-h-screen flex flex-col selection:bg-pastelPink selection:text-jarText" x-data="wishApp()">

    <!-- 1️⃣ FLOATING GLASS NAVBAR -->
    <header class="w-full px-6 py-4 fixed top-0 z-50 flex justify-center">
        <nav class="w-full max-w-5xl bg-white/70 backdrop-blur-md border border-white/60 shadow-lg rounded-full px-8 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2 font-heading text-lg font-bold cursor-pointer" @click="currentView = 'home'">
                <span>🫙</span>
                <span>A Little Jar of Wishes</span>
            </div>
            
            <div class="hidden md:flex items-center space-x-8 font-semibold text-sm">
                <button @click="currentView = 'home'" class="hover:text-pastelPink transition">Home</button>
                <button @click="scrollToHowItWorks()" class="hover:text-pastelPink transition">How It Works</button>
                <button @click="currentView = 'dashboard'" class="hover:text-pastelPink transition">My Jar</button>
            </div>

            <button @click="currentView = 'onboarding'" class="bg-pastelPink text-jarText px-5 py-2 rounded-full font-bold text-sm shadow-md hover:scale-105 active:scale-95 transition flex items-center space-x-1">
                <span>Create My Jar</span>
                <span>✨</span>
            </button>
        </nav>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow pt-28 pb-16 px-4 sm:px-6">

        <!-- 2️⃣ HOME VIEW -->
        <template x-if="currentView === 'home'">
            <div class="max-w-5xl mx-auto space-y-20">
                <!-- Hero Section -->
                <section class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                    <div class="space-y-6">
                        <div class="inline-block bg-lavender/60 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider">
                            ✨ A magical little place
                        </div>
                        <h1 class="text-4xl md:text-5xl font-bold leading-tight">
                            Keep your wishes safe, one little dream at a time.
                        </h1>
                        <p class="text-lg opacity-90">
                            Capture your core desires, store them in your transparent magical jar, and watch your dreams grow.
                        </p>
                        <div class="pt-2">
                            <button @click="currentView = 'onboarding'" class="bg-pastelPink text-jarText px-8 py-4 rounded-full font-bold shadow-md hover:scale-105 transition flex items-center space-x-2 text-base">
                                <span>✨ Create Your Jar</span>
                            </button>
                        </div>
                    </div>

                    <!-- Floating Jar Graphic Element -->
                    <div class="relative flex justify-center items-center">
                        <div class="absolute w-64 h-64 bg-skyBlue/30 rounded-full blur-2xl -z-10"></div>
                        <div class="bg-white/60 border border-white backdrop-blur-sm p-8 rounded-3xl shadow-xl animate-float text-center space-y-4">
                            <div class="text-7xl">🫙</div>
                            <div class="flex justify-center space-x-2 text-xl">
                                <span>💌</span><span>⭐</span><span>✨</span>
                            </div>
                            <p class="text-xs font-bold opacity-75">Your safe space for aspirations</p>
                        </div>
                    </div>
                </section>

                <!-- 3️⃣ HOW IT WORKS TIMELINE -->
                <section id="how-it-works" class="space-y-10 pt-10">
                    <div class="text-center space-y-2">
                        <h2 class="text-3xl font-bold">How It Works</h2>
                        <p class="text-sm opacity-80">Simple steps to manifest your magical reality</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white/70 border border-white backdrop-blur-sm p-6 rounded-3xl shadow-md space-y-3 transform rotate-1">
                            <div class="w-8 h-8 rounded-full bg-pastelPink flex items-center justify-center font-bold text-sm">1</div>
                            <h3 class="font-bold text-lg flex items-center space-x-2"><span>💌</span> <span>Write</span></h3>
                            <p class="text-sm opacity-80">Write your wish straight from your heart with authentic intention.</p>
                        </div>
                        <div class="bg-white/70 border border-white backdrop-blur-sm p-6 rounded-3xl shadow-md space-y-3 transform -rotate-1">
                            <div class="w-8 h-8 rounded-full bg-skyBlue flex items-center justify-center font-bold text-sm">2</div>
                            <h3 class="font-bold text-lg flex items-center space-x-2"><span>🫙</span> <span>Drop</span></h3>
                            <p class="text-sm opacity-80">Put it securely inside your personalized digital magical jar.</p>
                        </div>
                        <div class="bg-white/70 border border-white backdrop-blur-sm p-6 rounded-3xl shadow-md space-y-3 transform rotate-1">
                            <div class="w-8 h-8 rounded-full bg-softYellow flex items-center justify-center font-bold text-sm">3</div>
                            <h3 class="font-bold text-lg flex items-center space-x-2"><span>✨</span> <span>Keep</span></h3>
                            <p class="text-sm opacity-80">Watch your collection expand and collect stars as dreams blossom.</p>
                        </div>
                    </div>
                </section>
            </div>
        </template>

        <!-- 4️⃣ ONBOARDING VIEW -->
        <template x-if="currentView === 'onboarding'">
            <div class="max-w-md mx-auto bg-white/80 backdrop-blur-md border border-white p-8 rounded-3xl shadow-xl space-y-6">
                <div class="text-center space-y-3">
                    <div class="flex justify-center space-x-2 text-xs font-bold text-pastelPink">
                        <span class="text-jarText">●</span> <span>───</span> <span>○</span> <span>───</span> <span>○</span>
                    </div>
                    <h2 class="text-2xl font-bold">✨ Create Your Jar ✨</h2>
                    <p class="text-sm opacity-80">What shall we call your little jar?</p>
                </div>

                <div class="space-y-4">
                    <input type="text" x-model="jarName" class="w-full bg-cream border border-pastelPink/60 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pastelPink text-center font-semibold text-lg" placeholder="My Dream Jar 🫙">
                    
                    <button @click="currentView = 'writeWish'" class="w-full bg-pastelPink text-jarText py-3.5 rounded-full font-bold shadow-md hover:scale-[1.02] transition text-center">
                        Continue →
                    </button>
                </div>
            </div>
        </template>

        <!-- 5️⃣ WRITE A WISH VIEW -->
        <template x-if="currentView === 'writeWish'">
            <div class="max-w-lg mx-auto bg-white/80 backdrop-blur-md border border-white p-8 rounded-3xl shadow-xl space-y-6">
                <div class="text-center space-y-2">
                    <h2 class="text-2xl font-bold flex items-center justify-center space-x-2">
                        <span>💌</span><span>Write a little wish</span>
                    </h2>
                    <p class="text-sm opacity-80">What is living in your heart today?</p>
                </div>

                <div class="space-y-4">
                    <textarea rows="5" x-model="newWishText" class="w-full bg-cream border border-skyBlue/60 rounded-2xl p-4 focus:outline-none focus:ring-2 focus:ring-skyBlue text-sm leading-relaxed" placeholder="Dear Universe..."></textarea>
                    
                    <button @click="saveWish()" class="w-full bg-skyBlue text-jarText py-3.5 rounded-full font-bold shadow-md hover:scale-[1.02] transition flex items-center justify-center space-x-2">
                        <span>Put Into My Jar</span>
                        <span>🫙</span>
                    </button>
                </div>
            </div>
        </template>

        <!-- 6️⃣ & 7️⃣ MY JAR DASHBOARD & WISHES VIEW -->
        <template x-if="currentView === 'dashboard'">
            <div class="max-w-2xl mx-auto space-y-8">
                <!-- Dashboard Card -->
                <div class="bg-white/80 backdrop-blur-md border border-white p-8 rounded-3xl shadow-xl text-center space-y-6">
                    <div class="space-y-1">
                        <p class="text-xs opacity-70">☁️ Hello! Welcome back</p>
                        <h2 class="text-2xl font-bold text-pastelPink drop-shadow-sm" x-text="jarName || 'My Little Wish Jar'"></h2>
                    </div>

                    <!-- Stars Achievement -->
                    <div class="flex justify-center space-x-1 text-softYellow text-xl">
                        <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>☆</span>
                    </div>

                    <!-- Jar Central Visual Element -->
                    <div class="inline-block bg-skyBlue/20 border border-skyBlue/40 px-10 py-6 rounded-3xl shadow-inner relative">
                        <div class="text-6xl animate-float">🫙</div>
                        <div class="text-xs mt-2 opacity-75">💌 <span x-text="wishes.length"></span> Wishes Inside</div>
                    </div>

                    <div class="pt-2 flex flex-col sm:flex-row gap-3 justify-center">
                        <button @click="currentView = 'writeWish'" class="bg-pastelPink text-jarText px-6 py-3 rounded-full font-bold shadow-md hover:scale-105 transition text-sm">
                            + Add a New Wish
                        </button>
                        <button @click="currentView = 'share'" class="bg-lavender text-jarText px-6 py-3 rounded-full font-bold shadow-md hover:scale-105 transition text-sm">
                            🔗 Share Jar
                        </button>
                    </div>
                </div>

                <!-- Floating Paper Notes (Your Wishes) -->
                <div class="space-y-4">
                    <div class="text-center">
                        <h3 class="text-xl font-bold">✨ Your Little Wishes ✨</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <template x-for="(wish, index) in wishes" :key="index">
                            <div class="bg-white/70 border border-white p-5 rounded-2xl shadow-sm hover:shadow-md transition transform hover:-translate-y-1 relative cursor-pointer" :class="index % 2 === 0 ? 'rotate-1' : '-rotate-1'">
                                <div class="flex items-start justify-between">
                                    <span class="text-sm font-medium" x-text="'💌 ' + wish"></span>
                                    <span class="text-xs text-softYellow">⭐</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 8️⃣ SHARE YOUR JAR VIEW -->
        <template x-if="currentView === 'share'">
            <div class="max-w-md mx-auto bg-white/80 backdrop-blur-md border border-white p-8 rounded-3xl shadow-xl text-center space-y-6">
                <div class="text-4xl">🎀</div>
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold">Share Your Little Jar</h2>
                    <p class="text-sm opacity-80">Let someone special leave a wish for you</p>
                </div>

                <div class="bg-cream border border-lavender rounded-2xl p-3 text-xs font-mono opacity-80 select-all">
                    yourwebsite.com/jar/my-dream-jar
                </div>

                <button @click="alert('Magical link copied to clipboard! ✨')" class="w-full bg-lavender text-jarText py-3.5 rounded-full font-bold shadow-md hover:scale-[1.02] transition">
                    ✨ Copy Magical Link
                </button>

                <div>
                    <button @click="currentView = 'dashboard'" class="text-xs font-bold underline opacity-70 hover:opacity-100">
                        ← Back to My Dashboard
                    </button>
                </div>
            </div>
        </template>

    </main>

    <!-- FOOTER INFO -->
    <footer class="text-center py-6 text-xs opacity-60">
        Made with love, stars, and cute dreams 🌙✨
    </footer>

    <!-- Script File Reference -->
    <script src="script.js"></script>
</body>
</html>
